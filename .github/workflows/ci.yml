name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E y snapshots (Playwright)
    runs-on: ubuntu-latest
    # La imagen oficial trae los navegadores y las fuentes con las que se
    # generaron los snapshots; en otra imagen el renderizado daría diferencias.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Playwright
        run: npx playwright test

      - name: Subir informe
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  csp:
    name: CSP sobre el build (Playwright + wrangler)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      # `scripts/apply-csp.mjs` corre dentro de `npm run build`: sin ese paso el
      # _headers no lleva los hashes de los scripts inline y todo fallaría aquí.
      - name: Build
        run: npm run build

      - name: CSP
        run: npx playwright test --config playwright.csp.config.ts
        env:
          WRANGLER_SEND_METRICS: 'false'
